<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<title>Darkwinter</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; color: #f3e8ff; font: 15px/1.5 "Segoe UI", -apple-system, system-ui, sans-serif;
    background: radial-gradient(90% 60% at 80% 0%, rgb(244 63 214 / .22), transparent 60%),
                radial-gradient(80% 60% at 10% 100%, rgb(124 58 237 / .45), transparent 65%),
                linear-gradient(170deg, #2a0d52, #12082a 60%, #0a0418);
  }
  .card { width: min(420px, 88vw); padding: 36px 32px; text-align: center; border-radius: 28px; border: 1px solid rgb(196 128 255 / .3);
    background: linear-gradient(168deg, rgb(77 28 147 / .7), rgb(37 10 77 / .7)); box-shadow: 0 40px 90px -40px rgb(124 58 237 / .8), inset 0 1px 0 rgb(255 255 255 / .12); }
  .moon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: #1a0836; display: grid; place-items: center;
    box-shadow: 0 0 40px -6px #f43fd6, inset 0 0 0 2px rgb(231 180 255 / .5); }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  p { margin: 10px 0 0; color: rgb(243 232 255 / .7); }
  button { margin-top: 24px; width: 100%; height: 50px; border: 0; border-radius: 14px; color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    background: linear-gradient(90deg, #f43fd6, #a24bff 65%, #8a4dff); box-shadow: 0 16px 34px -14px rgb(244 63 214 / .7); }
  button:hover { filter: brightness(1.08); }
  small { display: block; margin-top: 14px; color: rgb(243 232 255 / .45); }
</style>
</head>
<body>
  <div class="card">
    <div class="moon"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fde9ff"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5Z"/></svg></div>
    <h1>You're offline</h1>
    <p>Darkwinter couldn't connect. Check your internet and try again.</p>
    <button type="button" onclick="window.darkwinterDesktop && window.darkwinterDesktop.retry()">Try again</button>
    <small>We'll also reconnect on our own as soon as you're back online.</small>
  </div>
  <script>window.addEventListener("online", function () { window.darkwinterDesktop && window.darkwinterDesktop.retry(); });</script>
</body>
</html>
